<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>予測の成績</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Roboto+Condensed:wght@500;700&display=swap">
<style>
/* 予測ページと同じトークン。累計表を先に、開催日ごとの明細を折りたたみで続ける */
:root{
  --bg:#f3f4f1;--card:#fff;--ink:#1b1f1c;--sub:#646b66;--line:#dfe2dd;
  --turf:#1f6b45;--turfbg:#e5f1ea;--next:#b4441c;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-num:"Roboto Condensed","Arial Narrow",var(--f-body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121513;--card:#1b1f1c;--ink:#e8ebe8;--sub:#9aa29c;--line:#2c322e;
  --turf:#6fcf9b;--turfbg:#183326;--next:#ff9466;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513;--card:#1b1f1c;--ink:#e8ebe8;--sub:#9aa29c;--line:#2c322e;
  --turf:#6fcf9b;--turfbg:#183326;--next:#ff9466;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body)}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:21px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:22px 0 8px}
.meta{color:var(--sub);font-size:12.5px;margin:4px 0 12px}
.meta a{color:var(--turf)}
.note{border-left:3px solid var(--turf);background:var(--card);padding:10px 12px;font-size:12.5px;color:var(--sub);margin:0 0 8px;border-radius:0 6px 6px 0}
.note b{color:var(--ink)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
thead th{font-size:11px;font-weight:400;color:var(--sub);border-top:0}
tbody th{text-align:left;font-weight:700}
td b{font:700 15px var(--f-num)}
td small{display:block;font-size:11px;color:var(--sub)}
table.races td,table.races th{text-align:left;font-family:var(--f-num)}
table.races tbody th{font-family:var(--f-body);font-weight:400}
.hit{color:var(--next);font-weight:700}
.day{margin-bottom:8px}
.day summary{cursor:pointer;font-weight:700;padding:8px 0}
.day summary:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
</style></head><body>
<div class="wrap">
<h1>予測の成績</h1>
<p class="meta">{{SPAN}} / <a href="./">当日の予測へ戻る</a></p>
<p class="note"><b>買い方</b> 各レース100円で、単勝◎・複勝◎・ワイド◎-○・馬連◎-○・3連複◎○▲を買った場合の回収率です。「除最大」は一番大きい払戻1本を除いた回収率で、たまたまの大当たりに引っぱられていないかを見ます。<b>対数尤度</b>は勝ち馬にどれだけ高い確率を付けていたかで、0に近いほど予測の精度が高いことを表します。</p>
<h2>累計</h2>
{{TOTAL}}
<h2>開催日ごと</h2>
{{DAYS}}
</div>
</body></html>
